server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The frontend's api-client makes relative /api/... requests (no base URL
    # baked in at build time), so this container must sit in front of the
    # backend and proxy them through. "backend" must match the shazam-backend
    # service/container name on the same Docker network in the Portainer stack.
    #
    # Resolve "backend" per-request via Docker's embedded DNS (127.0.0.11)
    # instead of once at nginx startup — a static proxy_pass hostname is
    # resolved only at boot, so if the backend container is restarting (or
    # not yet up) at that exact moment, nginx refuses to start at all.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream backend:8080;
        # proxy_pass with a variable upstream disables nginx's usual
        # "replace matched location prefix" URI rewriting, so the path here
        # must be built explicitly via $request_uri (includes the original
        # /api/... path + query string) rather than a static "/api/" suffix,
        # which would otherwise send every request as bare "/api/".
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
