name: Build and push shazam-frontend image

on:
  push:
    branches: [dev, uat, prod]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_CLERK_PROXY_URL=${{ secrets.VITE_CLERK_PROXY_URL }}
            VITE_PREVIEW_MODE=${{ secrets.VITE_PREVIEW_MODE }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shazam-frontend:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shazam-frontend:${{ github.ref_name }}-${{ github.sha }}
